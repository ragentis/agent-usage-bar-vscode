version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Keep compatibility types aligned with the supported VS Code and Node runtimes.
    ignore:
      # `vsce` requires this major/minor version not to exceed `engines.vscode`. Update both when
      # raising the minimum supported VS Code version.
      - dependency-name: "@types/vscode"
      # The extension bundle targets Node 20, while CI executes on Node 24. A newer types major could
      # therefore expose APIs that the target extension host does not provide.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

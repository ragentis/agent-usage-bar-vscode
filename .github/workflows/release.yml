name: Release

# One chain, from a push on main to a published extension: Release Please keeps a release pull
# request in step with main, and merging it starts everything below.
on:
  push:
    branches: [main]
  # Recomputes the release pull request without waiting for a commit, after a config change.
  workflow_dispatch:

# Nothing here needs write access by default; the two phases that do ask for it themselves.
permissions:
  contents: read

# Marketplace versions are immutable, so no two releases may publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Phase 1. On an ordinary push this only refreshes the release pull request. On the push that
  # merges it, it tags the commit and drafts the release instead, so the phases below can verify
  # it before its page and package are public.
  prepare:
    name: Prepare the release
    # Not redundant with `target-branch`: phase 2 calls ci.yml by relative path, which GitHub
    # resolves from the caller's commit, and phase 3 publishes before any environment policy runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main

  # Phase 2. The same CI `main` runs, at the SHA phase 1 reports — a commit, so no tag to resolve.
  # This is also where the VSIX the later phases publish is built.
  verify:
    name: Verify the release
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Phase 3. GitHub is the canonical, reversible home for the exact VSIX that passed verification.
  # `force-tag-creation` already laid the tag down with the draft, so the next run finds this
  # release rather than replaying the whole history; the release itself stays hidden until here.
  publish-release:
    name: Publish the release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: release-artifact

      # Nothing else ties the version the package was built from to the tag it is published under,
      # and the file name carries that version, so the check is free.
      - name: Check the package against the tag
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          expected="agent-usage-bar-${TARGET_TAG#v}.vsix"
          if [ ! -f "release-artifact/${expected}" ]; then
            echo "Expected ${expected}, found: $(ls release-artifact)" >&2
            exit 1
          fi
          echo "VSIX=release-artifact/${expected}" >> "$GITHUB_ENV"

      - name: Attach the package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TARGET_TAG" "$VSIX" --clobber
          gh release edit "$TARGET_TAG" --draft=false --latest

  # Phase 4. Both registries publish the artifact phase 2 built and phase 3 attached, so a store
  # install and a release download are the same bytes. A failing leg is re-run alone, and both skip
  # a version already published, so a repeat costs nothing. No GitHub credential reaches here.
  registries:
    name: Publish to ${{ matrix.registry }}
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: Visual Studio Marketplace
            cli: vsce
          - registry: Open VSX
            cli: ovsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Only to put `vsce` and `ovsx` on the path at the versions the lockfile pins.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: release-artifact
      - name: Publish
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
          # Each leg is handed the token for its own registry and nothing else.
          VSCE_PAT: ${{ matrix.cli == 'vsce' && secrets.VSCE_PAT || '' }}
          OVSX_PAT: ${{ matrix.cli == 'ovsx' && secrets.OVSX_PAT || '' }}
        # Both tools read their token from the environment and take the same two options here.
        run: |
          npx --no-install ${{ matrix.cli }} publish \
            --packagePath "release-artifact/agent-usage-bar-${TARGET_TAG#v}.vsix" --skip-duplicate

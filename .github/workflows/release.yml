name: Release

# One chain, from a push on main to a published extension: Release Please keeps a release pull
# request in step with main, and merging it starts everything below.
on:
  push:
    branches: [main]
  # Recomputes the release pull request without waiting for a commit, after a config change.
  workflow_dispatch:

# Nothing here needs write access by default; the two phases that do ask for it themselves.
permissions:
  contents: read

# Marketplace versions are immutable, so no two releases may publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Phase 1. On an ordinary push this only refreshes the release pull request. On the push that
  # merges it, it tags the commit and drafts the release instead, so the phases below can verify
  # it before its page and package are public.
  prepare:
    name: Prepare the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Phase 2. The same CI main runs, checked out at the release commit — what phase 1 reports,
  # leaving no tag to resolve. This is also where the VSIX the later phases publish is built.
  verify:
    name: Verify the release
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Phase 3. GitHub is the canonical, reversible home for the exact VSIX that passed verification.
  # `force-tag-creation` already laid the tag down with the draft, so the next run finds this
  # release rather than replaying the whole history; the release itself stays hidden until here.
  publish-release:
    name: Publish the release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: release-artifact

      # Two things no other step would notice: more than one package, and a stale one picked up by
      # a re-run. The name carries the version, so checking it costs nothing.
      - name: Resolve the package
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -t packages < <(find release-artifact -maxdepth 1 -type f -name '*.vsix')
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX, found ${#packages[@]}" >&2
            exit 1
          fi

          expected="agent-usage-bar-${TARGET_TAG#v}.vsix"
          if [ "$(basename "${packages[0]}")" != "$expected" ]; then
            echo "Expected ${expected}, found $(basename "${packages[0]}")" >&2
            exit 1
          fi
          echo "VSIX=${packages[0]}" >> "$GITHUB_ENV"

      - name: Attach the package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TARGET_TAG" "$VSIX" --clobber
          gh release edit "$TARGET_TAG" --draft=false --latest

  # Phase 4. Both registries take the package off the release rather than off the run that built
  # it: that copy is permanent where the build artifact expires, and it is the one whose name was
  # checked against the tag. Neither blocks the other, and both skip a version already published.
  marketplace:
    name: Publish to Visual Studio Marketplace
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Take the published package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          vsix="agent-usage-bar-${TARGET_TAG#v}.vsix"
          gh release download "$TARGET_TAG" --pattern "$vsix" --dir release-artifact
          echo "VSIX=release-artifact/${vsix}" >> "$GITHUB_ENV"
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$VSIX" --skip-duplicate

  open-vsx:
    name: Publish to Open VSX
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Take the published package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          vsix="agent-usage-bar-${TARGET_TAG#v}.vsix"
          gh release download "$TARGET_TAG" --pattern "$vsix" --dir release-artifact
          echo "VSIX=release-artifact/${vsix}" >> "$GITHUB_ENV"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish "$VSIX" --skip-duplicate

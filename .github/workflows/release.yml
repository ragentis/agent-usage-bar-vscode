name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.0)
        required: true
        type: string
      publish_marketplace:
        description: Publish to Visual Studio Marketplace
        required: true
        default: true
        type: boolean
      publish_open_vsx:
        description: Publish to Open VSX
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Marketplace versions are immutable, so no two releases may publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the tag input
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must have the form vX.Y.Z, received: ${TARGET_TAG}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      # A release tag must describe the manifest version and a commit reviewed through main.
      - name: Validate the tagged commit
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          tagged_commit="$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")"
          if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
            echo "Checkout does not point to ${TARGET_TAG}" >&2
            exit 1
          fi

          manifest="$(node -p "require('./package.json').version")"
          if [ "$TARGET_TAG" != "v${manifest}" ]; then
            echo "Tag ${TARGET_TAG} does not match package.json version ${manifest}" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${TARGET_TAG} is not on the history of main" >&2
            exit 1
          fi

  # The same CI main runs, but checked out at the exact tag selected above.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  # GitHub is the canonical, reversible home for the exact VSIX that passed verification.
  github-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifact
      - name: Resolve the package
        run: |
          mapfile -t packages < <(find release-artifact -maxdepth 1 -type f -name '*.vsix')
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX, found ${#packages[@]}" >&2
            exit 1
          fi
          echo "VSIX=${packages[0]}" >> "$GITHUB_ENV"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" "$VSIX" --clobber
          else
            gh release create "$TARGET_TAG" "$VSIX" --verify-tag --generate-notes
          fi

  marketplace:
    if: ${{ inputs.publish_marketplace }}
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifact
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath release-artifact/*.vsix --skip-duplicate

  open-vsx:
    if: ${{ inputs.publish_open_vsx }}
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: release-artifact
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish release-artifact/*.vsix --skip-duplicate
